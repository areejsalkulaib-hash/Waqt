name: Verify polling owner alert route

on:
  schedule:
    - cron: "17 8 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: polling-owner-route-synthetic-drill
  cancel-in-progress: false

jobs:
  verify-owner-route:
    name: Open, deduplicate, and recover synthetic incidents
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Exercise both polling incident routes
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/polling_owner_route_drill.py